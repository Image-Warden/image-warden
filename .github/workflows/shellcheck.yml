name: ShellCheck

on:
  push:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/test.sh'
      - 'config/**'
      - 'install.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/test.sh'
      - 'config/**'
      - 'install.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: dnf install -y ShellCheck

      - name: Run ShellCheck
        run: |
          shellcheck --shell=bash \
            tools/test.sh \
            tests/test_*.sh \
            tests/helpers/assertions.sh \
            tests/helpers/fakebin/* \
            bin/iw-* \
            lib/*.sh \
            install.sh

  tests:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        run: dnf install -y bash coreutils findutils gawk jq

      - name: Run tests
        run: bash tools/test.sh
